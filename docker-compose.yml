services:
  postgres:
    image: postgres:16
    container_name: eventix-postgres
    environment:
      POSTGRES_USER: eventix
      POSTGRES_PASSWORD: eventix
      POSTGRES_DB: eventix
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eventix-redis
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: postgresql://eventix:eventix@postgres:5432/eventix
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: eventix
      S3_ENDPOINT: https://ce9b9f6a606b3c8a285e512301594761.r2.cloudflarestorage.com
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_REGION: auto
      PRISMA_SEED_ON_BOOT: ${PRISMA_SEED_ON_BOOT:-false}
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
        NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL}
    environment:
      INTERNAL_API_BASE_URL: http://api:3001
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
